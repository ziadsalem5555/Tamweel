<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#eff6ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#e2e8f0" stroke-width="0.8" opacity="0.5"/></pattern>
  </defs>
  <rect width="800" height="600" fill="url(#sky2)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- header -->
  <rect x="0" y="0" width="800" height="70" fill="white" opacity="0.9"/>
  <text x="400" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f766e" letter-spacing="3">WATER NETWORK • SINAI</text>
  <text x="400" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">10 Wells • Sustainable Pipeline • No humans</text>
  <!-- map card -->
  <rect x="80" y="90" width="640" height="380" rx="20" fill="white" stroke="#cbd5e1" stroke-width="2" />
  <rect x="80" y="90" width="640" height="36" rx="20" fill="#0f766e"/>
  <rect x="80" y="110" width="640" height="16" fill="#0f766e"/>
  <circle cx="110" cy="108" r="6" fill="#fde68a"/><circle cx="130" cy="108" r="6" fill="#86efac"/><circle cx="150" cy="108" r="6" fill="#7dd3fc"/>
  <text x="400" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="1">PIPELINE SCHEMATIC</text>
  <!-- pipeline -->
  <rect x="120" y="180" width="560" height="100" rx="50" fill="#f0fdfa" stroke="#0ea5e9" stroke-width="3"/>
  <rect x="140" y="210" width="520" height="40" rx="20" fill="#0ea5e9" opacity="0.15"/>
  <rect x="140" y="220" width="520" height="20" rx="10" fill="#0ea5e9" opacity="0.9"/>
  <rect x="140" y="225" width="520" height="6" rx="3" fill="#7dd3fc" opacity="0.6"/>
  <!-- wells -->
  <g>
    <circle cx="180" cy="230" r="38" fill="white" stroke="#0f766e" stroke-width="3"/>
    <circle cx="180" cy="230" r="22" fill="#0ea5e9" opacity="0.15" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="180" cy="230" r="12" fill="#0ea5e9"/><circle cx="180" cy="230" r="6" fill="#e0f2fe"/>
    <text x="180" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#0f766e">WELL 1</text>
    <text x="180" y="298" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#64748b">500 people</text>
  </g>
  <g>
    <circle cx="400" cy="230" r="38" fill="white" stroke="#0f766e" stroke-width="3"/>
    <circle cx="400" cy="230" r="22" fill="#0ea5e9" opacity="0.15" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="400" cy="230" r="12" fill="#0ea5e9"/><circle cx="400" cy="230" r="6" fill="#e0f2fe"/>
    <text x="400" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#0f766e">WELL 5</text>
    <text x="400" y="298" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#64748b">1500 people</text>
  </g>
  <g>
    <circle cx="620" cy="230" r="38" fill="white" stroke="#0f766e" stroke-width="3"/>
    <circle cx="620" cy="230" r="22" fill="#0ea5e9" opacity="0.15" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="620" cy="230" r="12" fill="#0ea5e9"/><circle cx="620" cy="230" r="6" fill="#e0f2fe"/>
    <text x="620" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#0f766e">WELL 10</text>
    <text x="620" y="298" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#64748b">500 people</text>
  </g>
  <!-- connectors -->
  <rect x="218" y="226" width="144" height="8" rx="4" fill="#0f766e"/>
  <rect x="438" y="226" width="144" height="8" rx="4" fill="#0f766e"/>
  <circle cx="290" cy="230" r="5" fill="#f59e0b"/><circle cx="510" cy="230" r="5" fill="#f59e0b"/>
  <!-- stats -->
  <g transform="translate(140,340)">
    <rect width="170" height="70" rx="12" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0f766e" letter-spacing="1">TOTAL Wells</text>
    <text x="85" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#0f172a">10</text>
    <text x="85" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#64748b">villages</text>
  </g>
  <g transform="translate(315,340)">
    <rect width="170" height="70" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8" letter-spacing="1">PEOPLE Served</text>
    <text x="85" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#1e3a8a">5,000</text>
    <text x="85" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#64748b">beneficiaries</text>
  </g>
  <g transform="translate(490,340)">
    <rect width="170" height="70" rx="12" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#92400e" letter-spacing="1">WATER / Day</text>
    <text x="85" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#78350f">20k L</text>
    <text x="85" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#92400e">liters</text>
  </g>
</svg>
