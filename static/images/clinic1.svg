<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ecfdf5"/><stop offset="100%" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="van" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- top bar -->
  <rect width="800" height="64" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="40" cy="32" r="12" fill="#0f766e"/><text x="40" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="900" fill="white">+</text>
  <text x="65" y="26" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0f172a">MOBILE CLINIC</text>
  <text x="65" y="42" font-family="Inter, sans-serif" font-size="10" fill="#64748b" letter-spacing="1">UPPER EGYPT • FREE CARE</text>
  <rect x="620" y="18" width="140" height="28" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="634" cy="32" r="6" fill="#10b981"/><text x="645" y="36" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#065f46">On duty</text>
  <!-- road -->
  <rect y="460" width="800" height="140" fill="#334155"/>
  <rect y="528" width="800" height="6" fill="white" stroke-dasharray="40 30" opacity="0.9"/>
  <rect y="460" width="800" height="12" fill="#475569"/>
  <!-- van - improved -->
  <g transform="translate(160,260)">
    <!-- shadow -->
    <ellipse cx="240" cy="205" rx="210" ry="18" fill="#0f172a" opacity="0.12"/>
    <!-- body -->
    <rect x="0" y="20" width="480" height="160" rx="20" fill="url(#van)" stroke="#0f766e" stroke-width="3.5"/>
    <rect x="0" y="20" width="480" height="36" rx="20" fill="#0f766e"/>
    <rect x="0" y="40" width="480" height="16" fill="#0f766e"/>
    <text x="240" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="white" letter-spacing="3">MOBILE CLINIC</text>
    <!-- red cross -->
    <rect x="220" y="62" width="40" height="40" rx="8" fill="#ef4444" stroke="white" stroke-width="2"/>
    <rect x="236" y="70" width="8" height="24" rx="2" fill="white"/><rect x="228" y="78" width="24" height="8" rx="2" fill="white"/>
    <!-- windows -->
    <rect x="18" y="68" width="130" height="68" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="18" y="68" width="130" height="68" rx="10" fill="white" opacity="0.35"/>
    <path d="M25 80 L140 80 L130 125 L25 125 Z" fill="white" opacity="0.45"/>
    <rect x="332" y="68" width="130" height="68" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="332" y="68" width="130" height="68" rx="10" fill="white" opacity="0.35"/>
    <!-- door line -->
    <line x1="300" y1="56" x2="300" y2="180" stroke="#0f766e" stroke-width="2" opacity="0.15"/>
    <rect x="288" y="100" width="8" height="20" rx="4" fill="#0f766e" opacity="0.8"/>
    <!-- wheels -->
    <circle cx="90" cy="190" r="34" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
    <circle cx="90" cy="190" r="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><circle cx="90" cy="190" r="5" fill="#475569"/>
    <circle cx="390" cy="190" r="34" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
    <circle cx="390" cy="190" r="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><circle cx="390" cy="190" r="5" fill="#475569"/>
    <!-- under glow -->
    <rect x="40" y="170" width="400" height="4" rx="2" fill="#0f766e" opacity="0.15"/>
  </g>
  <!-- stats bar -->
  <rect x="140" y="490" width="520" height="60" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="313" y1="500" x2="313" y2="540" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="486" y1="500" x2="486" y2="540" stroke="#e2e8f0" stroke-width="1"/>
  <text x="226" y="508" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">VILLAGES</text>
  <text x="226" y="530" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#0f172a">12</text>
  <text x="400" y="508" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">PATIENTS</text>
  <text x="400" y="530" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#0f172a">10,000</text>
  <text x="573" y="508" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">STATUS</text>
  <text x="573" y="530" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#0f766e">FREE • NO HUMANS</text>
</svg>
