  <rect x="620" y="16" width="150" height="24" rx="12" fill="#dbeafe"/><text x="695" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">10,000 doses</text>
