  <line x1="555" y1="315" x2="675" y2="315" stroke="#ddd6fe" stroke-width="2"/><line x1="555" y1="325" x2="660" y2="325" stroke="#ddd6fe" stroke-width="2"/><line x1="555" y1="335" x2="670" y2="335" stroke="#ddd6fe" stroke-width="2"/>
  <circle cx="560" cy="310" r="4" fill="#8b5cf6"/><circle cx="575" cy="310" r="4" fill="#8b5cf6"/>
