    <rect x="10" y="20" width="36" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="8" width="28" height="18" rx="4" fill="#334155"/>
    <rect x="20" y="-4" width="8" height="14" rx="3" fill="#e2e8f0"/>
    <circle cx="28" cy="45" r="9" fill="#f59e0b" stroke="white" stroke-width="1.5"/>
    <text x="28" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#94a3b8">ORANGE</text>
  </g>
  <g transform="translate(340,470)">
    <ellipse cx="40" cy="85" rx="40" ry="8" fill="#0f172a" opacity="0.3"/>
    <rect x="10" y="20" width="36" height="62" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="14" y="8" width="28" height="18" rx="4" fill="#0284c7"/>
    <rect x="20" y="-4" width="8" height="14" rx="3" fill="#bae6fd"/>
    <circle cx="28" cy="45" r="9" fill="white" stroke="#e0f2fe" stroke-width="1.5"/>
    <text x="28" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#94a3b8">BLUE</text>
  </g>
  <g transform="translate(440,470)">
    <ellipse cx="40" cy="85" rx="40" ry="8" fill="#0f172a" opacity="0.3"/>
    <rect x="10" y="20" width="36" height="62" rx="8" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
    <rect x="14" y="8" width="28" height="18" rx="4" fill="#991b1b"/>
    <rect x="20" y="-4" width="8" height="14" rx="3" fill="#fecaca"/>
    <circle cx="28" cy="45" r="9" fill="white" stroke="#fecaca" stroke-width="1.5"/>
    <text x="28" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#94a3b8">RED</text>
  </g>
  <g transform="translate(540,470)">
    <ellipse cx="40" cy="85" rx="40" ry="8" fill="#0f172a" opacity="0.3"/>
    <rect x="10" y="20" width="36" height="62" rx="8" fill="#10b981" stroke="#065f46" stroke-width="1.5"/>
    <rect x="14" y="8" width="28" height="18" rx="4" fill="#065f46"/>
    <rect x="20" y="-4" width="8" height="14" rx="3" fill="#a7f3d0"/>
    <circle cx="28" cy="45" r="9" fill="white" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="28" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#94a3b8">GREEN</text>
  </g>
