<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#334155"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wall)"/>
  <!-- brick texture -->
  <g opacity="0.08" stroke="#475569" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/><line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/><line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/><line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/><line x1="500" y1="0" x2="500" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/><line x1="700" y1="0" x2="700" y2="600"/>
  </g>
  <!-- top light -->
  <rect width="800" height="8" fill="#fde68a" opacity="0.9"/>
  <rect y="8" width="800" height="4" fill="#f59e0b" opacity="0.6"/>
  <!-- main mural frame -->
  <rect x="60" y="40" width="680" height="420" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2.5"/>
  <rect x="60" y="40" width="680" height="28" rx="16" fill="#1e293b"/>
  <rect x="60" y="52" width="680" height="16" fill="#1e293b"/>
  <circle cx="90" cy="56" r="6" fill="#ef4444"/><circle cx="110" cy="56" r="6" fill="#f59e0b"/><circle cx="130" cy="56" r="6" fill="#10b981"/>
  <text x="400" y="60" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#94a3b8" letter-spacing="2">DOWNTOWN CAIRO • WALL 7</text>
  <!-- mural content - abstract, no humans -->
  <rect x="90" y="90" width="620" height="340" rx="12" fill="#f8fafc"/>
  <!-- large CAIRO text as art -->
  <text x="400" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="#0f172a" letter-spacing="6">CAIRO</text>
  <text x="400" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="none" stroke="#f59e0b" stroke-width="1.5" letter-spacing="6" opacity="0.4">CAIRO</text>
  <!-- colorful geometric -->
  <circle cx="170" cy="220" r="42" fill="#f59e0b" opacity="0.95"/>
  <rect x="240" y="180" width="90" height="90" rx="14" fill="#0ea5e9" transform="rotate(12 285 225)" opacity="0.95"/>
  <polygon points="430,170 485,250 375,250" fill="#ef4444" opacity="0.95"/>
  <rect x="510" y="185" width="76" height="76" rx="38" fill="#10b981" opacity="0.95"/>
  <rect x="620" y="195" width="60" height="60" rx="8" fill="#8b5cf6" opacity="0.9" transform="rotate(8 650 225)"/>
  <!-- paint drips -->
  <rect x="178" y="262" width="7" height="38" rx="3.5" fill="#f59e0b" opacity="0.7"/>
  <rect x="285" y="270" width="6" height="28" rx="3" fill="#0ea5e9" opacity="0.7"/>
  <rect x="460" y="250" width="7" height="34" rx="3.5" fill="#ef4444" opacity="0.7"/>
  <rect x="545" y="261" width="6" height="24" rx="3" fill="#10b981" opacity="0.7"/>
  <rect x="625" y="255" width="5" height="22" rx="2.5" fill="#8b5cf6" opacity="0.6"/>
  <!-- bottom bar on mural -->
  <rect x="150" y="310" width="500" height="48" rx="10" fill="#0f172a"/>
  <text x="400" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="white" letter-spacing="4">STREET ART FESTIVAL</text>
  <text x="400" y="348" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8" letter-spacing="2">30 ARTISTS • 3 DAYS • DOWNTOWN</text>
  <!-- spray cans row -->
  <g transform="translate(240,470)">
