{% extends 'base.html' %}

{% block title %}404 - Page Not Found | CrowdFund Egypt{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="py-5">
    <div class="display-1 fw-bold text-primary mb-3">404</div>
    <h2 class="fw-bold mb-3">Page Not Found</h2>
    <p class="text-muted mx-auto mb-4" style="max-width: 500px;">
      The page or campaign you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4">
      <i class="fa-solid fa-house me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
