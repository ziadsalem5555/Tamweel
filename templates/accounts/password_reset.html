{% extends 'base.html' %}

{% block title %}Reset Password | CrowdFund Egypt{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="card-header bg-primary text-white text-center py-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-white text-primary rounded-circle mb-2" style="width: 50px; height: 50px;">
            <i class="fa-solid fa-key fs-4"></i>
          </div>
          <h3 class="fw-bold mb-0">Reset Password</h3>
          <p class="small text-white-50 mb-0">Enter your email to receive a password reset link</p>
        </div>

        <div class="card-body p-4 p-md-5">
          <form method="POST" novalidate>
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label fw-semibold small">Registered Email Address</label>
              <input type="email" name="email" class="form-control" placeholder="name@example.com" required id="id_email">
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold shadow-sm">
                Send Reset Link
              </button>
            </div>

            <div class="text-center small">
              <a href="{% url 'accounts:login' %}" class="text-decoration-none text-muted">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
