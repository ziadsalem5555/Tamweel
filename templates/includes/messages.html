{% if messages %}
<div class="container mt-3">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm border-0 d-flex align-items-center gap-2" role="alert">
      {% if message.tags == 'success' %}
        <i class="fa-solid fa-circle-check fs-5 text-success"></i>
      {% elif message.tags == 'danger' or message.tags == 'error' %}
        <i class="fa-solid fa-triangle-exclamation fs-5 text-danger"></i>
      {% elif message.tags == 'warning' %}
        <i class="fa-solid fa-circle-exclamation fs-5 text-warning"></i>
      {% else %}
        <i class="fa-solid fa-circle-info fs-5 text-info"></i>
      {% endif %}
      <div class="flex-grow-1">
        {{ message }}
      </div>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% endfor %}
</div>
{% endif %}
